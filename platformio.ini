[platformio]
src_dir = .
include_dir = .
test_dir = test
default_envs = release

[env]
lib_deps =
    https://github.com/eagletrt/libeagletrt-sw.git#v0.1.0
    https://github.com/eagletrt/libbms-monitor-sw.git#dev

[env:release]
platform = ststm32
upload_protocol = stlink
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200
extra_scripts = pre:scripts/build_script.py

board = nucleo_f446ze
board_build.ldscript = ./STM32F446ZETx_FLASH.ld

build_flags =
    -std=gnu23
    -Wl,-Map,./.pio/build/release/output_release.map

    -std=gnu23

    -DUSE_HAL_DRIVER
    -DSCNu8=\"hhu\"
    -DSCNi8=\"hhi\"
    -D_XOPEN_SOURCE
    -D HSE_VALUE=16000000 ; define HSE value for clock configuration (I don't know if this is right but looking at the ioc this seems to be the value for the external crystal on the board)

    -ICore/Inc
    -ICore/Inc/common
    -ICore/Inc/bms
    -ICore/Inc/bms/errors
    -ICore/Inc/bms/drivers
    -ICore/Inc/bms/cooling
    -ICore/Inc/bms/timebase
    -ICore/Inc/bms/volt
    -ICore/Inc/bms/programmer
    -ICore/Inc/bms/temp
    -ICore/Inc/bms/balancing
    -ICore/Inc/bms/identity
    -ICore/Inc/bms/current
    -ICore/Inc/bms/internal-voltage
    -ICore/Inc/bms/display
    -ICore/Lib
    -ICore/Lib/micro-libs/bms-monitor/inc
    -ICore/Lib/micro-libs/ring-buffer/inc
    -ICore/Lib/micro-libs/errorlib/inc
    -ICore/Lib/micro-libs/blinky/inc
    -ICore/Lib/micro-libs/min-heap/inc
    -ICore/Lib/can/lib
    -ICore/Lib/can/lib/bms
    -ICore/Lib/can/lib/primary
    -IDrivers/CMSIS/Device/ST/STM32F4xx/Include
    -IDrivers/CMSIS/Include
    -IDrivers/STM32F4xx_HAL_Driver/Inc

build_src_filter =
    +<Core/Src/**>
    +<Core/Lib/can/lib/*.c>
    +<Core/Lib/can/lib/bms/*_network.c>
    +<Core/Lib/can/lib/primary/*_network.c>
    +<Core/Lib/micro-libs/bms-monitor/src/**>
    +<Core/Lib/micro-libs/ring-buffer/src/**>
    +<Core/Lib/micro-libs/errorlib/src/**>
    +<Core/Lib/micro-libs/blinky/src/**>
    +<Core/Lib/micro-libs/min-heap/src/**>
    +<Drivers/STM32F4xx_HAL_Driver/Src/**>
    -<Drivers/STM32F4xx_HAL_Driver/Src/**/*_template.c>
    +<./startup_stm32f446xx.s>

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*,-bugprone-easily-swappable-parameters
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.+/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
check_src_filters =
    -<**>
    +<Core/Src/bms>
    +<Core/Inc/bms>



[env:tests]
platform = native
test_framework = unity
test_build_src = true

build_flags =
    -std=gnu23
    -DEAGLETRT_STATIC=
    -DEAGLETRT_STATIC_INLINE=

    -DUSE_HAL_DRIVER
    -DSCNu8=\"hhu\"
    -DSCNi8=\"hhi\"
    -D_XOPEN_SOURCE
    -D HSE_VALUE=16000000 ; define HSE value for clock configuration (I don't know if this is right but looking at the ioc this seems to be the value for the external crystal on the board)
    -D_STATIC=

    -lm

    ; Kept for debugging purposes
    -DBALANCING_TESTS=1
    -DCAN_COMM_TESTS=1
    -DCURRENT_TESTS=1
    -DDISPLAY_TESTS=1
    -DFEEDBACK_TESTS=1
    -DIDENTITY_TESTS=1
    -DIMD_TESTS=1
    -DINTERNAL_VOLTAGE_TESTS=1
    -DLED_TESTS=1
    -DPCU_TESTS=1
    -DTEMP_TESTS=1
    -DVOLT_TESTS=1
    -DTASKS_TESTS=1
    -DTIMEBASE_TESTS=1

    -Itest/include

    -ICore/Inc
    -ICore/Inc/common
    -ICore/Inc/bms
    -ICore/Inc/bms/errors
    -ICore/Inc/bms/drivers
    -ICore/Inc/bms/cooling
    -ICore/Inc/bms/timebase
    -ICore/Inc/bms/volt
    -ICore/Inc/bms/programmer
    -ICore/Inc/bms/temp
    -ICore/Inc/bms/balancing
    -ICore/Inc/bms/identity
    -ICore/Inc/bms/current
    -ICore/Inc/bms/internal-voltage
    -ICore/Inc/bms/display
    -ICore/Lib
    -ICore/Lib/micro-libs/bms-monitor/inc
    -ICore/Lib/micro-libs/ring-buffer/inc
    -ICore/Lib/micro-libs/errorlib/inc
    -ICore/Lib/micro-libs/blinky/inc
    -ICore/Lib/micro-libs/min-heap/inc
    -ICore/Lib/can/lib
    -ICore/Lib/can/lib/bms
    -ICore/Lib/can/lib/primary

build_src_filter =
    +<Core/Src/bms/**>
    +<Core/Lib/can/lib/*.c>
    +<Core/Lib/can/lib/bms/*_network.c>
    +<Core/Lib/can/lib/primary/*_network.c>
    +<Core/Lib/micro-libs/bms-monitor/src/**>
    +<Core/Lib/micro-libs/ring-buffer/src/**>
    +<Core/Lib/micro-libs/errorlib/src/**>
    +<Core/Lib/micro-libs/blinky/src/**>
    +<Core/Lib/micro-libs/min-heap/src/**>
