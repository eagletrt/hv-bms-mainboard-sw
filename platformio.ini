[platformio]
src_dir = .
include_dir = .
test_dir = test
default_envs = release

[env]
lib_deps =
    https://github.com/eagletrt/libeagletrt-sw.git#v0.1.0
    https://github.com/eagletrt/libmin-heap-sw.git#dev
    https://github.com/eagletrt/libcan-sw.git#master
    https://github.com/eagletrt/libpal-sw.git#v0.1.0


; Include paths shared by the firmware and the tests
[bms]
include_flags =
    -ICore/Inc
    -ICore/Inc/common
    -ICore/Inc/bms
    -ICore/Inc/bms/applications/bal-control
    -ICore/Inc/bms/applications/current
    -ICore/Inc/bms/applications/display
    -ICore/Inc/bms/applications/flash-control
    -ICore/Inc/bms/applications/identity
    -ICore/Inc/bms/applications/internal-temperatures
    -ICore/Inc/bms/applications/internal-voltages
    -ICore/Inc/bms/applications/led
    -ICore/Inc/bms/applications/mainboard-status
    -ICore/Inc/bms/applications/request-control
    -ICore/Inc/bms/applications/sensors
    -ICore/Inc/bms/applications/temperatures
    -ICore/Inc/bms/applications/voltages
    -ICore/Inc/bms/control/mainboard-fsm
    -ICore/Inc/bms/control/mainboard-tasks
    -ICore/Inc/bms/control/mainboard-watchdogs
    -ICore/Inc/bms/control/PCU
    -ICore/Inc/bms/control/POST
    -ICore/Inc/bms/interfaces/CAN
    -ICore/Inc/bms/interfaces/drivers
    -ICore/Inc/bms/interfaces/drivers/ir1553204
    -ICore/Inc/bms/interfaces/drivers/max22530
    -ICore/Inc/bms/interfaces/drivers/tdsr0760
    -ICore/Inc/bms/interfaces/logging
    -ICore/Inc/bms/interfaces/sensing

[env:release]
platform = ststm32
upload_protocol = stlink
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200
extra_scripts = pre:scripts/build_script.py

board = nucleo_f446ze
board_build.ldscript = ./STM32F446XX_FLASH.ld

build_flags =
    -std=gnu23
    -DUSE_HAL_DRIVER
    -D_XOPEN_SOURCE ; Used for 'strptime'
    ${bms.include_flags}
    -IDrivers/CMSIS/Device/ST/STM32F4xx/Include
    -IDrivers/CMSIS/Include
    -IDrivers/STM32F4xx_HAL_Driver/Inc

build_src_filter =
    +<Core/Src/>
    +<Drivers/STM32F4xx_HAL_Driver/Src/**>
    -<Drivers/STM32F4xx_HAL_Driver/Src/**/*_template.c>
    +<./startup_stm32f446xx.s>

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*,-bugprone-easily-swappable-parameters
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.+/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
    clangtidy: --extra-arg=-std=gnu23
    clangtidy: --extra-arg=-U__cplusplus
check_src_filters =
    -<**>
    +<Core/Src/bms>
    +<Core/Inc/bms>

[env:tests]
platform = native
test_framework = unity
test_build_src = true

build_flags =
    -std=gnu23
    -DEAGLETRT_STATIC=
    ; -DEAGLETRT_STATIC_INLINE=
    -DUSE_HAL_DRIVER
    -D_XOPEN_SOURCE
    -D_STATIC=
    -lm
    -Itest/include
    ${bms.include_flags}

build_src_filter =
    +<Core/Src/bms/>

; Same firmware, linked after the OpenBLT bootloader (first 32K of flash).
; Produces firmware.srec (with the OpenBLT checksum) for flashing over CAN.
; `pio run -e release-bootloader -t upload` flashes firmware.bin at 0x08008000 via ST-Link.
[env:release-bootloader]
extends = env:release
board_build.ldscript = ./STM32F446XX_FLASH-shifted.ld
board_upload.offset_address = 0x08008000
board_upload.maximum_size = 491520
extra_scripts =
    pre:scripts/build_script.py
    post:scripts/openblt_image.py

[env:bootloader]
platform = ststm32
upload_protocol = stlink
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200
debug_tool = stlink

board = nucleo_f446ze
board_build.ldscript = ./STM32F446XX_FLASH.ld
build_flags =
    -std=gnu23
    -DUSE_HAL_DRIVER
    -DUSE_FULL_LL_DRIVER
    -Ihv-bms-mainboard-bootloader-sw/Core/Inc
    -Ihv-bms-mainboard-bootloader-sw/Core/Inc/openblt
    -Ihv-bms-mainboard-bootloader-sw/Drivers/STM32F4xx_HAL_Driver/Inc
    -Ihv-bms-mainboard-bootloader-sw/Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
    -Ihv-bms-mainboard-bootloader-sw/Drivers/CMSIS/Device/ST/STM32F4xx/Include
    -Ihv-bms-mainboard-bootloader-sw/Drivers/CMSIS/Include
build_src_filter =
    +<hv-bms-mainboard-bootloader-sw/*.s>
    +<hv-bms-mainboard-bootloader-sw/Core/Src/>
    +<hv-bms-mainboard-bootloader-sw/Drivers/STM32F4xx_HAL_Driver/Src/>
    -<hv-bms-mainboard-bootloader-sw/Drivers/STM32F4xx_HAL_Driver/Src/*_template.c>
